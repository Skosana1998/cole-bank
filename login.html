
<script src="https://cdn.jsdelivr.net/npm/appwrite@29.0.0"></script>
<script>
const client = new Appwrite.Client()
  .setEndpoint("https://nyc.cloud.appwrite.io/v1")
  .setProject("6ad745480034e078da3e");

const account = new Appwrite.Account(client);
const ID = Appwrite.ID;

const message = document.getElementById("message");
const form = document.getElementById("authForm");
const button = document.getElementById("submitButton");
const switchMode = document.getElementById("switchMode");
const switchText = document.getElementById("switchText");
const subtitle = document.getElementById("subtitle");
const password = document.getElementById("password");

let isRegistering = false;

switchMode.addEventListener("click", () => {
  isRegistering = !isRegistering;
  button.textContent = isRegistering ? "Create Account" : "Sign In";
  switchText.textContent = isRegistering
    ? "Already registered?" : "New to Cole Bank?";
  switchMode.textContent = isRegistering ? " Sign in" : " Create account";
  subtitle.textContent = isRegistering
    ? "Create your secure client login" : "Secure client access";
  password.autocomplete = isRegistering
    ? "new-password" : "current-password";
  message.textContent = "";
});

form.addEventListener("submit", async (event) => {
  event.preventDefault();
  message.textContent = "";
  button.disabled = true;
  button.textContent = "Please wait...";

  const email = document.getElementById("email").value.trim();
  const pass = password.value;

  try {
    if (isRegistering) {
      await account.create({
        userId: ID.unique(),
        email,
        password: pass
      });

      await account.createEmailPasswordSession({ email, password: pass });
      window.location.href = new URL(
        "dashboard.html", window.location.href
      ).href;
    } else {
      await account.createEmailPasswordSession({ email, password: pass });
      window.location.href = new URL(
        "dashboard.html", window.location.href
      ).href;
    }
  } catch (error) {
    message.textContent = error.message ||
      "Unable to sign in. Please try again.";
  } finally {
    button.disabled = false;
    button.textContent = isRegistering ? "Create Account" : "Sign In";
  }
});
</script>
